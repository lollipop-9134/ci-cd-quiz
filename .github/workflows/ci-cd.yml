name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-app

jobs:
  # ==================== CI 阶段 ====================
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. 打印所有环境变量
      - name: Print all environment variables
        run: env | sort

      # 2. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. 安装依赖（Python 示例）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 编译/打包
      - name: Compile / Package
        run: |
          python -m compileall .
          echo "Packaging complete."

      # 5. 构建 Docker 镜像
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      # 6. 生成时间戳标签并重新打标
      - name: Tag image with timestamp
        id: tag
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "FULL_TAG=${{ env.IMAGE_NAME }}:$TIMESTAMP" >> $GITHUB_ENV
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:$TIMESTAMP

      # 7. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. 推送镜像到 Docker Hub
      - name: Push image to Docker Hub
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }} ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}
          docker push ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}

      # 9. 导出镜像为 tar 文件
      - name: Save image as tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }} -o docker-image.tar

      # 10. 上传 tar 作为 artifact
      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: docker-image.tar
          retention-days: 7

      # 11. 在运行页面打印镜像版本信息
      - name: Print final image version info
        run: |
          echo "### 🐳 Docker Image Version Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ env.TIMESTAMP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Reference | ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }} |" >> $GITHUB_STEP_SUMMARY

  # ==================== CD 阶段 (DEV) ====================
  cd-dev:
    needs: ci
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      # 1. 下载之前上传的 tar artifact
      - name: Download tar artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-tar

      # 2. 加载镜像到本地
      - name: Load Docker image from tar
        run: docker load -i docker-image.tar

      # 3. 使用 suffix 重新打标
      - name: Retag image with suffix
        run: |
          ORIGINAL_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '${{ env.IMAGE_NAME }}' | head -n1)
          echo "Original image: $ORIGINAL_IMAGE"
          docker tag $ORIGINAL_IMAGE ${{ env.IMAGE_NAME }}:${{ vars.suffix }}
          echo "Retagged to: ${{ env.IMAGE_NAME }}:${{ vars.suffix }}"

      # 4. 列出所有本地镜像
      - name: List all local images
        run: docker images

  # ==================== CD 阶段 (PROD) ====================
  cd-prod:
    needs: ci
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Download tar artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-tar

      - name: Load Docker image from tar
        run: docker load -i docker-image.tar

      - name: Retag image with suffix
        run: |
          ORIGINAL_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '${{ env.IMAGE_NAME }}' | head -n1)
          echo "Original image: $ORIGINAL_IMAGE"
          docker tag $ORIGINAL_IMAGE ${{ env.IMAGE_NAME }}:${{ vars.suffix }}
          echo "Retagged to: ${{ env.IMAGE_NAME }}:${{ vars.suffix }}"

      - name: List all local images
        run: docker images